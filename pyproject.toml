[build-system]
requires = ["maturin>=1.13.3,<2.0"]
build-backend = "maturin"

[project]
name = "bidsaid"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Donisha Smith", email = "dsmit420@jhu.edu"}]
description = "A toolkit for creating and managing BIDS-compliant fMRI datasets without original DICOMs."
readme = "README.md"
requires-python = ">=3.10.0"

keywords = [
    "python",
    "neuroimaging",
    "fMRI",
    "MRI",
    "BIDS",
    "NIfTI",
    ]

classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Development Status :: 3 - Alpha"
    ]

dependencies = [
    "numpy>=1.26.3",
    "nibabel>=5.0.0",
    "rich>=14.2.0",
    "nilearn>=0.10.4",
    "pandas>=2.1.0",
    "pybids>=0.16.5; platform_system != 'Windows'",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    ]

[project.optional-dependencies]
all = ["bidsaid[test, windows]"]
test = ["pytest", "pytest-cov"]
windows = ["pybids>=0.16.5"]

[tool.setuptools.packages.find]
where = ["python/bidsaid"]
include = ["bidsaid", "bidsaid.*"]

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
branch = true
source = ["bidsaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88

[tool.maturin]
python-source = "python"
module-name = "bidsaid._rust"
features = ["pyo3/extension-module"]

[project.urls]
Homepage = "https://bidsaid.readthedocs.io"
Github = "https://github.com/donishadsmith/bidsaid"
Issues = "https://github.com/donishadsmith/bidsaid/issues"
Changelog = "https://bidsaid.readthedocs.io/en/stable/changelog.html"
