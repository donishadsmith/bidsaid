name: Minimum Dependencies Test

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - '*'
  # Run weekly on Monday
  schedule:
    - cron: 0 0 * * 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-minimum-dependencies:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']

    name: Python 3.11 on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-ver }}

      - name: Install Xvfb and OpenGL
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Set up headless display for rendering tests
        uses: pyvista/setup-headless-display-action@v4

      - name: Install minimum dependencies for Ubuntu and MacOS
        if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest' }}
        run: |
          pip install -r requirements.txt
        working-directory: tests/minimum_dependencies

      - name: Install minimum dependencies on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          git config --system core.longpaths true
          pip install -r requirements.txt
        working-directory: tests/minimum_dependencies

      - name: Install package
        run: pip install .[all]

      - name: Run tests for all OS on Python 3.10
        run: pytest .
